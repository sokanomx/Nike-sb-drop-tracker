name: Nike SB Tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "poll"
        type: choice
        options:
          - poll
          - seed
          - test-discord

permissions:
  contents: write

concurrency:
  group: nike-sb-tracker-state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m tracker.cli "${{ github.event.inputs.mode || 'poll' }}"
      - name: Persist tracker state
        if: ${{ github.event.inputs.mode != 'test-discord' }}
        run: |
          if git diff --quiet -- state/seen.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update tracker state"
          git push
